<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const token = sessionStorage.getItem('iic_token');
      let user = null;
      try { user = JSON.parse(sessionStorage.getItem('iic_user')); } catch(e) {}
      const isAdmin = user && (user.role === 'admin' || user.role === 'ADMIN' || user.role === 'SUPER_ADMIN');
      if (!token || !isAdmin) {
        window.location.href = '/admin/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Manage admin access for IIC Events Platform" />
  <title>Admins — IIC Events Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
</head>
<body class="admin-page">
<div class="admin-layout">

  <!-- ══ SIDEBAR ══ -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-sidebar__logo" style="padding: 24px; text-align: center;">
      <h2 style="color: white; font-size: 20px; margin: 0; font-family: 'Poppins', sans-serif;">IIC Admin</h2>
    </div>
    <nav class="admin-sidebar__nav">
      <div class="admin-nav-section">
        <div class="admin-nav-section-title">Main Menu</div>
        <a href="index.html" class="admin-nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="events.html" class="admin-nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Manage Events
        </a>
        <a href="participants.html" class="admin-nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Upload Attendance
        </a>
        <a href="certificates.html" class="admin-nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
          Send Certificates
        </a>
        <a href="admins.html" class="admin-nav-link active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Admins
        </a>
      </div>
    </nav>
  </aside>

  <!-- ══ MAIN CONTENT ══ -->
  <main class="admin-main">

    <!-- Topbar -->
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:16px;">
        <button class="admin-sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar" style="display:none;background:none;border:none;cursor:pointer;color:#64748B;padding:4px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
                  <div style="display: flex; gap: 12px; align-items: center;">
            <img src="/images/vit-logo-new.png" alt="VIT Logo" style="height: 38px; object-fit: contain;" />
            <img src="/images/iic-logo-new.png" alt="IIC Logo" style="height: 40px; object-fit: contain;" />
            <img src="/images/edc-logo.png" alt="EDC Logo" style="height: 40px; object-fit: contain;" />
            <img src="/images/ipr-logo.jpg" alt="IPR Logo" style="height: 52px; object-fit: contain;" />
          </div>
          <div style="font-family: 'Bebas Neue', sans-serif !important; font-size: 22px; letter-spacing: 0.5px; color: var(--text-heading, #1e293b); border-left: 2px solid #e2e8f0; padding-left: 16px; margin-left: 4px; white-space: nowrap; margin-bottom: -4px;">
            The Office of Innovation, Startup and Technology Transfer
          </div>
      </div>
      <div class="admin-topbar__right">
        <button class="admin-search-btn" id="openGlobalSearchBtn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>

        <div class="admin-profile-menu">
          <button class="admin-avatar-trigger" id="profileMenuBtn">
            <div class="admin-avatar" id="adminAvatar">S</div>
          </button>

          <div class="admin-profile-dropdown hidden" id="profileDropdown">
            <div class="admin-profile-dropdown__header">
              <div id="adminProfileName" style="font-weight:600;color:var(--text-heading);font-size:14px;">Administrator</div>
              <div id="dropdownRole" style="font-size:12px;color:var(--text-muted);margin-top:2px;">Super Admin</div>
              <div id="adminProfileEmail" style="font-size:12px;color:var(--text-muted);margin-top:2px;">admin@iic.edu</div>
            </div>
            <div class="admin-profile-dropdown__body">
              <a href="#" class="logout-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Content -->
    <div class="admin-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
        <button class="btn btn-primary" onclick="openModal('addAdminModal')" style="border-radius: 50px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Admin
        </button>
      </div>
      <div class="admin-section-card">
        <div class="admin-section-card__body" style="padding:0;">
          <table class="table" style="margin:0;">
            <thead>
              <tr>
                <th style="text-align: center;">Name</th>
                <th style="text-align: center;">Email</th>
                <th style="text-align: center;">Role</th>
                <th style="text-align: center;">Added On</th>
                <th style="text-align: center;">Actions</th>
              </tr>
            </thead>
            <tbody id="adminsTableBody">
              <!-- Admins will be loaded here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add Admin Modal -->
<div class="modal-overlay hidden" id="addAdminModal">
  <div class="modal" style="max-width:500px;">
    <div class="modal__header">
      <h3 class="modal__title">Add New Admin</h3>
      <button class="modal__close" data-modal-close>&times;</button>
    </div>
    <div class="modal__body">
      <form id="addAdminForm">
        <div class="form-group">
          <label class="form-label" for="adminName">Full Name</label>
          <input type="text" class="form-input" id="adminName" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="adminEmail">Email Address</label>
          <input type="email" class="form-input" id="adminEmail" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="adminPassword">Password</label>
          <input type="password" class="form-input" id="adminPassword" minlength="6"
                 autocomplete="new-password"
                 placeholder="Min 6 chars — required for the admin to sign in" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="adminRole">Role</label>
          <select class="form-select" id="adminRole">
            <option value="ADMIN">Admin</option>
            <option value="SUPER_ADMIN">Super Admin</option>
          </select>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:24px;">
          <button type="button" class="btn btn-secondary" style="border-radius: 50px;" data-modal-close>Cancel</button>
          <button type="submit" class="btn btn-primary" style="border-radius: 50px;" id="saveAdminBtn">Add Admin</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script type="module" src="js/admin-auth.js"></script>
<script type="module" src="js/admin-admins.js"></script>
</body>
</html>
