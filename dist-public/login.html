<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to IIC Events — access your registrations and certificates." />
  <title>Login — IIC Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    .auth-inst-page {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Top Header with Logos ── */
    .auth-inst-header {
      width: 100%;
      background: #fff;
      padding: 24px 0 16px;
      text-align: center;
      border-bottom: 1px solid #e8e8e8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .auth-inst-header__logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 12px;
    }
    .auth-inst-header__logos img {
      height: 64px;
      width: auto;
      object-fit: contain;
    }
    .auth-inst-header__text {
      font-family: var(--font-body);
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }
    .auth-inst-header__title {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 800;
      color: #1a1a2e;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ── Form Area ── */
    .auth-inst-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      width: 100%;
    }
    .auth-inst-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      animation: scaleIn 0.4s ease forwards;
      text-align: center;
    }
    .auth-inst-card__heading {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    .auth-inst-card__sub {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* ── Google Button Container ── */
    .google-btn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
      min-height: 44px;
    }
    
    .google-signin-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      padding: 10px 24px;
      background-color: #fff;
      border: 1px solid #dadce0;
      border-radius: 24px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #3c4043;
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s;
    }
    .google-signin-btn:hover {
      background-color: #f8f9fa;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
    }
    .google-signin-btn img {
      width: 20px;
      height: 20px;
    }

    /* ── Domain Notice ── */
    .auth-domain-notice {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      background: #f0f7ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #1e40af;
      margin-top: 8px;
    }
    .auth-domain-notice svg {
      flex-shrink: 0;
    }

    /* ── Error ── */
    .auth-inst-error {
      background: rgba(231,76,60,0.08);
      border: 1px solid rgba(231,76,60,0.2);
      border-radius: 10px;
      padding: 14px 18px;
      color: #e74c3c;
      font-size: 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .auth-inst-error svg {
      flex-shrink: 0;
    }

    /* ── Loading Spinner ── */
    .auth-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
    }
    .auth-loading.active {
      display: flex;
    }
    .auth-loading__spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e5e7eb;
      border-top-color: #1B005D;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .auth-loading__text {
      font-size: 14px;
      color: #6b7280;
      font-weight: 500;
    }

    /* ── Divider ── */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    /* AUTH-001: Responsive layout for small phones */
    @media (max-width: 480px) {
      .auth-inst-card {
        padding: 32px 20px;
        margin: 0 8px;
      }
      .auth-inst-header__logos {
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .auth-inst-header__logos img {
        height: clamp(36px, 10vw, 48px);
      }
      .auth-inst-header__text {
        font-size: clamp(14px, 5vw, 20px) !important;
        padding: 0 12px;
      }
      .auth-inst-header__title {
        font-size: clamp(14px, 5vw, 18px);
      }
      .auth-inst-header {
        padding: 16px 0 12px;
      }
      .auth-inst-body {
        padding: 24px 12px;
      }
    }

    /* AUTH-001: Very small phones (360px and below) */
    @media (max-width: 360px) {
      .auth-inst-header__logos {
        gap: 8px;
      }
      .auth-inst-header__logos img {
        height: 32px;
      }
      .auth-inst-card {
        padding: 24px 16px;
      }
      .auth-inst-card__heading {
        font-size: 22px;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/login-DuuMPwQ5.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-Ba9QOxWH.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-Dh8knowi.js">
  <link rel="stylesheet" crossorigin href="/assets/auth-0wub1irN.css">
  <link rel="stylesheet" crossorigin href="/assets/base-DdfbKP-A.css">
  <link rel="stylesheet" crossorigin href="/assets/layout-C7IwP640.css">
</head>
<body>

<div class="auth-inst-page">
  <!-- ── Institutional Header ── -->
  <header class="auth-inst-header">
    <div class="auth-inst-header__logos" style="gap: 16px;">
      <img src="images/vit-logo-new.png" alt="VIT" style="height: 48px; object-fit: contain;" />
      <img src="images/iic-logo-new.png" alt="IIC" style="height: 48px; object-fit: contain;" />
      <img src="images/edc-logo.png" alt="EDC" style="height: 48px; object-fit: contain;" />
      <img src="images/ipr-logo.jpg" alt="IPR" style="height: 68px; object-fit: contain;" />
    </div>
    <div class="auth-inst-header__text" style="font-family: 'Bebas Neue', sans-serif !important; font-size: 26px; letter-spacing: 0.5px; color: var(--text-heading, #1e293b); text-transform: uppercase;">The Office of Innovation, Startup and Technology Transfer</div>
  </header>

  <!-- ── Login Card ── -->
  <div class="auth-inst-body">
    <div class="auth-inst-card">
      <h1 class="auth-inst-card__heading">Welcome</h1>
      <p class="auth-inst-card__sub">Sign in with your VIT student Google account to access events, registrations, and certificates.</p>

      <!-- Error Message -->
      <div class="hidden auth-inst-error" id="formError">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span id="formErrorText"></span>
      </div>

      <!-- Loading State -->
      <div class="auth-loading" id="authLoading">
        <div class="auth-loading__spinner"></div>
        <div class="auth-loading__text">Signing you in...</div>
      </div>

      <!-- Google Sign-In Button -->
      <div class="google-btn-container" id="googleBtnContainer">
        <button id="googleSignInBtn" class="google-signin-btn">
          <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
            <path fill="none" d="M0 0h48v48H0z"></path>
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- Domain Notice -->
      <div class="auth-domain-notice">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>Only <strong>@vitstudent.ac.in</strong> email addresses are accepted</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
