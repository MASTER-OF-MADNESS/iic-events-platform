<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | IIC Events</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      font-family: 'Poppins', sans-serif;
      background: #f8fafc;
    }
    h1 {
      font-size: 8rem;
      color: var(--primary);
      margin: 0;
      line-height: 1;
    }
    h2 {
      font-size: 2rem;
      color: var(--text-heading);
      margin-bottom: 1rem;
    }
    p {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    a {
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.2s;
    }
    a:hover {
      background: var(--primary-dark);
    }
  </style>
  <link rel="stylesheet" crossorigin href="/assets/base-DdfbKP-A.css">
</head>
<body>
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page you are looking for doesn't exist or has been moved.</p>
  <a href="/">Go Back Home</a>
</body>
</html>
