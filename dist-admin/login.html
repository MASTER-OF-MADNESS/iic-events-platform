<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin Login — IIC Events Management Platform" />
  <title>Admin Login — IIC Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .admin-login-header {
      width: 100%;
      background: #fff;
      padding: 24px 0 16px;
      text-align: center;
      border-bottom: 1px solid #e8e8e8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .admin-login-header__logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 12px;
    }

    .admin-login-header__logos img {
      height: 64px;
      width: auto;
      object-fit: contain;
    }

    .admin-login-header__text {
      font-size: 14px;
      color: #555;
    }

    .admin-login-header__title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #1a1a2e;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .admin-login-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      width: 100%;
    }

    .admin-login-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      animation: cardIn 0.4s ease forwards;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .admin-login-card h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 6px;
    }

    .admin-login-card__sub {
      text-align: center;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 28px;
    }

    .admin-field {
      margin-bottom: 18px;
    }

    .admin-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    .admin-field label span {
      color: #e74c3c;
    }

    .admin-field-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .admin-field input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: #1a1a2e;
      background: #fafbfc;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .admin-field input::placeholder {
      color: #9ca3af;
    }

    .admin-field input:focus {
      border-color: #1B005D;
      box-shadow: 0 0 0 3px rgba(26, 26, 108, 0.08);
      background: #fff;
    }

    .admin-toggle-pw {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }

    .admin-toggle-pw:hover {
      color: #555;
    }

    .admin-login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #1B005D;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 6px;
    }

    .admin-login-btn:hover {
      background: #12124e;
      transform: translateY(-1px);
    }

    .admin-login-btn:active {
      transform: translateY(0);
    }

    .admin-login-btn.loading {
      pointer-events: none;
      opacity: 0.7;
      position: relative;
      color: transparent;
    }

    .admin-login-btn.loading::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      top: calc(50% - 9px);
      left: calc(50% - 9px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .admin-login-error {
      background: rgba(231, 76, 60, 0.08);
      border: 1px solid rgba(231, 76, 60, 0.2);
      border-radius: 8px;
      padding: 12px 16px;
      color: #e74c3c;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .admin-login-error.visible {
      display: block;
    }

    @media (max-width: 480px) {
      .admin-login-card {
        padding: 28px 20px;
        margin: 0 12px;
      }

      .admin-login-header__logos img {
        height: 48px;
      }

      .admin-login-header__title {
        font-size: 16px;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/login-DYRoe99v.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-BDslKlxA.js">
  <link rel="stylesheet" crossorigin href="/assets/api-DdfbKP-A.css">
</head>

<body>

  <header class="admin-login-header">
    <div class="admin-login-header__logos" style="gap: 16px;">
      <img src="/images/vit-logo-new.png" alt="VIT" style="height: 48px; object-fit: contain;" />
      <img src="/images/iic-logo-new.png" alt="IIC" style="height: 48px; object-fit: contain;" />
      <img src="/images/edc-logo.png" alt="EDC" style="height: 48px; object-fit: contain;" />
      <img src="/images/ipr-logo.jpg" alt="IPR" style="height: 75px; object-fit: contain;" />
    </div>
    <div class="admin-login-header__text"
      style="font-family: 'Bebas Neue', sans-serif !important; font-size: 26px; letter-spacing: 0.5px; color: var(--text-heading, #1e293b); text-transform: uppercase;">
      The Office of Innovation, Startup and Technology Transfer</div>
    <div class="admin-login-header__title">ADMIN PANEL</div>
  </header>

  <div class="admin-login-body">
    <div class="admin-login-card">
      <h1 style="text-align: center;">LOGIN</h1>
      <p class="admin-login-card__sub"></p>

      <form id="adminLoginForm" novalidate>
        <div class="admin-field">
          <label for="email">Email Address <span>*</span></label>
          <div class="admin-field-wrap">
            <input type="email" id="email" placeholder="admin@email.com" autocomplete="email" required />
          </div>
        </div>

        <div class="admin-field">
          <label for="password">Password <span>*</span></label>
          <div class="admin-field-wrap">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"
              required />
            <button type="button" class="admin-toggle-pw" id="togglePw" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="admin-login-error" id="formError"></div>

        <button type="submit" class="admin-login-btn" id="loginBtn">Sign In</button>
      </form>
    </div>
  </div>

</body>

</html>
